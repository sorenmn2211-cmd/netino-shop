
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کافی‌نت آنلاین نتینو</title>
<style>
body{font-family:Tahoma,Arial;background:#f1f5f9;color:#172554;margin:0}
header{background:#123b70;color:white;text-align:center;padding:28px 12px}
main{max-width:650px;margin:20px auto;padding:15px}
.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #0001}
h2{color:#1261a0}
button{background:#087e8b;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer}
input,select,textarea{box-sizing:border-box;width:100%;padding:12px;margin:7px 0 14px;border:1px solid #cbd5e1;border-radius:8px}
a{color:#087e8b}
</style>
</head>
<body>
<header>
<h1>💻 کافی‌نت آنلاین نتینو</h1>
<p>تمام خدمات اینترنتی، سریع و مطمئن</p>
</header>
<main>
<section class="card">
<h2>خدمات نتینو</h2>
<p>📝 ثبت‌نام‌های اینترنتی</p>
<p>🏫 ثبت‌نام مدارس و دانشگاه</p>
<p>💳 خدمات بانکی و پرداخت قبوض</p>
<p>🖨️ چاپ و اسکن مدارک</p>
<p>📁 ارسال فایل برای چاپ</p>
</section>
<section class="card">
<h2>ثبت سفارش</h2>
<form id="orderForm">
<label>نام و نام خانوادگی</label>
<input id="name" required minlength="2" placeholder="نام شما">
<label>شماره تماس</label>
<input id="phone" required type="tel" placeholder="شماره تماس">
<label>نوع خدمت</label>
<select id="service">
<option>ثبت‌نام اینترنتی</option>
<option>ثبت‌نام مدارس و دانشگاه</option>
<option>پرداخت قبض</option>
<option>چاپ و اسکن</option>
<option>سایر خدمات اینترنتی</option>
</select>
<label>توضیحات سفارش</label>
<textarea id="details" rows="3" placeholder="توضیحات یا تعداد صفحات"></textarea>
<button type="submit">ثبت سفارش</button>
</form>
<p id="result"></p>
</section>
<section class="card">
<h2>تماس با نتینو</h2>
<p>برای پیگیری سفارش خود، از طریق بازوی نتینو پیام بدهید.</p>
<p><a href="https://ble.ir/khabar_tekab1">ارتباط در بله</a></p>
</section>
</main>
<script>
document.getElementById('orderForm').addEventListener('submit',function(e){
e.preventDefault();
const order={
name:document.getElementById('name').value,
phone:document.getElementById('phone').value,
service:document.getElementById('service').value,
details:document.getElementById('details').value
};
const orders=JSON.parse(localStorage.getItem('netinoOrders')||'[]');
orders.push(order);
localStorage.setItem('netinoOrders',JSON.stringify(orders));
document.getElementById('result').textContent='سفارش در همین مرورگر ذخیره شد. برای نهایی‌کردن سفارش، با نتینو تماس بگیرید.';
this.reset();
});
</script>
</body>
</html>
